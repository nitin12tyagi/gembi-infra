version: '3.9'

services:

  app:
    image: nginx:latest
    container_name: gembi-app
    restart: always
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    container_name: gembi-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gembi-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data:
EOF
